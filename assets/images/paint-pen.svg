<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="100%" stop-color="#FFE4D6" />
    </linearGradient>
    <linearGradient id="pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <g transform="translate(60, 40)">
    <!-- Palette / Art Elements -->
    <circle cx="380" cy="90" r="45" fill="#FED7AA" opacity="0.6"/>
    <circle cx="440" cy="150" r="30" fill="#FDBA74" opacity="0.5"/>
    <circle cx="100" cy="240" r="50" fill="#E2E8F0" opacity="0.7"/>
    <!-- Scratch Fix Surface -->
    <rect x="80" y="80" width="340" height="220" rx="16" fill="#1E293B" filter="url(#shadow)" />
    <!-- Metallic Sheen -->
    <path d="M 80 180 Q 250 120 420 180" stroke="#38BDF8" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 120 200 L 280 200" stroke="#EF4444" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
    <!-- Paint Pen Tool -->
    <g transform="rotate(-35 300 160)" filter="url(#shadow)">
      <rect x="270" y="60" width="40" height="180" rx="10" fill="url(#pen)" />
      <rect x="278" y="40" width="24" height="20" rx="4" fill="#E2E8F0" />
      <polygon points="282,40 298,40 290,10" fill="#0284C7" />
      <rect x="270" y="220" width="40" height="24" rx="4" fill="#0F172A" />
      <rect x="275" y="110" width="30" height="50" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <line x1="280" y1="125" x2="300" y2="125" stroke="#7C2D12" stroke-width="3"/>
      <line x1="280" y1="135" x2="296" y2="135" stroke="#7C2D12" stroke-width="2"/>
    </g>
  </g>
</svg>
