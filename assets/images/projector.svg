<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0F172A" />
  <!-- Light Beam projection -->
  <polygon points="340,195 590,80 590,320" fill="url(#beam)" opacity="0.65" />
  <!-- Projector Unit -->
  <g transform="translate(100, 120)">
    <!-- Main Shell -->
    <rect x="30" y="40" width="240" height="110" rx="16" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <!-- Ventilation Grille -->
    <line x1="50" y1="65" x2="150" y2="65" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="78" x2="150" y2="78" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="91" x2="150" y2="91" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="104" x2="150" y2="104" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Lens Assembly -->
    <circle cx="215" cy="95" r="38" fill="#0F172A" stroke="#38BDF8" stroke-width="5" />
    <circle cx="215" cy="95" r="28" fill="url(#projBg)" />
    <circle cx="205" cy="85" r="10" fill="#FFFFFF" opacity="0.7"/>
    <!-- Feet -->
    <rect x="50" y="150" width="20" height="10" rx="2" fill="#0F172A" />
    <rect x="210" y="150" width="20" height="10" rx="2" fill="#0F172A" />
  </g>
</svg>
