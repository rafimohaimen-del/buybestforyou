<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="12" fill="#F4EDE7" />
  <g transform="translate(100, 50)">
    <!-- Jumper Pack / Battery Kit -->
    <rect x="20" y="30" width="160" height="110" rx="14" fill="#1E293B" stroke="#7A4E2D" stroke-width="3"/>
    <rect x="35" y="45" width="60" height="30" rx="4" fill="#0F172A" />
    <text x="65" y="66" fill="#10B981" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">100%</text>
    <!-- Cables and clamps -->
    <path d="M 140 45 Q 180 10 210 50" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
    <path d="M 150 55 Q 190 30 210 90" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <!-- Clamp -->
    <polygon points="210,40 230,45 225,60 215,50" fill="#EF4444" />
    <polygon points="210,80 230,85 225,100 215,90" fill="#1E293B" />
  </g>
</svg>
