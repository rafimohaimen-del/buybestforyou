<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    <linearGradient id="mowerBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="mowerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#grass)" />
  <!-- Garden subtle backdrop -->
  <circle cx="120" cy="100" r="70" fill="#A5D6A7" opacity="0.4" />
  <circle cx="480" cy="80" r="90" fill="#81C784" opacity="0.3" />
  <!-- Mower Shadow Ground -->
  <ellipse cx="300" cy="275" rx="160" ry="25" fill="#1B5E20" opacity="0.2" />
  <!-- Robotic Mower Body -->
  <g transform="translate(160, 110)" filter="url(#mowerShadow)">
    <!-- Chassis -->
    <path d="M 40 140 C 40 60, 90 20, 160 20 C 230 20, 260 70, 260 140 C 260 170, 220 180, 150 180 C 80 180, 40 170, 40 140 Z" fill="url(#mowerBody)" />
    <!-- Cyan highlight accent band -->
    <path d="M 60 120 C 70 80, 100 50, 160 50 C 210 50, 235 75, 245 110" stroke="#06B6D4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Top Display Lid -->
    <rect x="120" y="70" width="70" height="50" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <circle cx="155" cy="95" r="8" fill="#10B981" />
    <!-- Rear Big Wheels -->
    <ellipse cx="60" cy="140" rx="20" ry="32" fill="#0F172A" stroke="#06B6D4" stroke-width="4"/>
    <ellipse cx="240" cy="140" rx="20" ry="32" fill="#0F172A" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="60" cy="140" r="8" fill="#64748B" />
    <circle cx="240" cy="140" r="8" fill="#64748B" />
    <!-- Front Bumper Sensors -->
    <circle cx="130" cy="170" r="4" fill="#38BDF8" />
    <circle cx="170" cy="170" r="4" fill="#38BDF8" />
  </g>
</svg>
