    <!-- LED Matrix Grid Points -->
    <circle cx="70" cy="70" r="3" fill="#EF4444" />
    <circle cx="95" cy="65" r="3" fill="#EF4444" />
    <circle cx="120" cy="65" r="3" fill="#EF4444" />
