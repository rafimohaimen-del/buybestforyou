    <line x1="85" y1="110" x2="85" y2="145" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="115" x2="100" y2="140" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="122" x2="115" y2="133" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
