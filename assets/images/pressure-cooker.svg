<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cookerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#3B0764" />
  <g transform="translate(180, 80)">
    <!-- Base Pot -->
    <rect x="30" y="80" width="180" height="150" rx="20" fill="url(#steel)" stroke="#475569" stroke-width="4"/>
    <!-- Handles -->
    <rect x="0" y="110" width="30" height="24" rx="6" fill="#1E293B" />
    <rect x="210" y="110" width="30" height="24" rx="6" fill="#1E293B" />
    <!-- Lid Assembly -->
    <path d="M 20 80 Q 120 40 220 80 Z" fill="#1E293B" />
    <rect x="100" y="30" width="40" height="20" rx="4" fill="#0F172A" />
    <!-- Control Display Panel -->
    <rect x="70" y="120" width="100" height="70" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="85" y="132" width="70" height="24" rx="4" fill="#0284C7" />
    <text x="120" y="150" font-family="monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OFF</text>
    <circle cx="95" cy="172" r="5" fill="#EF4444" />
    <circle cx="120" cy="172" r="5" fill="#10B981" />
    <circle cx="145" cy="172" r="5" fill="#F59E0B" />
  </g>
</svg>
